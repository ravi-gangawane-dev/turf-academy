<section class="app-list-page audit-log-page">
  <app-page-hero title="Audit log" subtitle="Recorded changes and the account that made each change." [breadcrumbs]="[
        { label: 'Dashboard', icon: 'pi-home', route: '/dashboard' },
        { label: 'Academy Settings', icon: 'pi-cog', route: '/settings' },
        { label: 'Audit log' },
      ]" />

  <app-settings-tabs />
  @if (error()) {
  <app-async-state kind="error" title="Audit log request failed" [message]="error()" actionLabel="Retry"
    (action)="load(page())" />
  }
  @if (loading()) {
  <app-async-state title="Loading audit log…" />
  }
  <section class="app-card audit-results" aria-label="Audit events">
    <app-data-table [total]="total()" [page]="page()" [pageSize]="pageSize()" itemLabel="events"
      (pageChange)="load($event)" (pageSizeChange)="setPageSize($event)">
      <div class="table-wrap" table-content>
        <app-table-tools title="Audit log" [table]="exportTable1" [total]="total()">
          <button type="button" (click)="resetFilters()">Reset filters</button>
        </app-table-tools>
        <table #exportTable1 class="academy-table">
          <thead>
            <tr>
              <th scope="col" [attr.aria-sort]="
                  sortBy === 'occurred_at'
                    ? sortDirection === 'asc'
                      ? 'ascending'
                      : 'descending'
                    : 'none'
                ">
                <app-sortable-header sortKey="occurred_at" [activeSort]="sortBy" [direction]="sortDirection"
                  (sortChange)="sortColumn('occurred_at')">Date</app-sortable-header>
              </th>
              <th scope="col" [attr.aria-sort]="
                  sortBy === 'action'
                    ? sortDirection === 'asc'
                      ? 'ascending'
                      : 'descending'
                    : 'none'
                ">
                <app-sortable-header sortKey="action" [activeSort]="sortBy" [direction]="sortDirection"
                  (sortChange)="sortColumn('action')">Action</app-sortable-header>
              </th>
              <th scope="col" [attr.aria-sort]="
                  sortBy === 'table_name'
                    ? sortDirection === 'asc'
                      ? 'ascending'
                      : 'descending'
                    : 'none'
                ">
                <app-sortable-header sortKey="table_name" [activeSort]="sortBy" [direction]="sortDirection"
                  (sortChange)="sortColumn('table_name')">Table</app-sortable-header>
              </th>
              <th scope="col" [attr.aria-sort]="
                  sortBy === 'record_id'
                    ? sortDirection === 'asc'
                      ? 'ascending'
                      : 'descending'
                    : 'none'
                ">
                <app-sortable-header sortKey="record_id" [activeSort]="sortBy" [direction]="sortDirection"
                  (sortChange)="sortColumn('record_id')">Record</app-sortable-header>
              </th>
              <th scope="col" [attr.aria-sort]="
                  sortBy === 'actor_id'
                    ? sortDirection === 'asc'
                      ? 'ascending'
                      : 'descending'
                    : 'none'
                ">
                <app-sortable-header sortKey="actor_id" [activeSort]="sortBy" [direction]="sortDirection"
                  (sortChange)="sortColumn('actor_id')">Account</app-sortable-header>
              </th>
            </tr>
            <tr class="column-filters">
              <th>
                <app-column-filter label="date" ariaLabel="Filter by date" type="date" [value]="filters.date"
                  (changed)="setFilter('date', $event)" />
              </th>
              <th>
                <app-column-filter label="action" ariaLabel="Filter by action" type="search" [value]="filters.action"
                  (changed)="setFilter('action', $event)" />
              </th>
              <th>
                <app-column-filter label="table" ariaLabel="Filter by table" type="search" [value]="filters.table"
                  (changed)="setFilter('table', $event)" />
              </th>
              <th>
                <app-column-filter label="record" ariaLabel="Filter by record" type="search" [value]="filters.record"
                  (changed)="setFilter('record', $event)" />
              </th>
              <th>
                <app-column-filter label="account" ariaLabel="Filter by account" type="search" [value]="filters.account"
                  (changed)="setFilter('account', $event)" />
              </th>
            </tr>
          </thead>
          <tbody [attr.aria-busy]="loading()">
            @for (row of rows(); track row.id) {
            <tr>
              <td>{{ row.occurred_at | academyDate: 'medium' }}</td>
              <td>{{ row.action }}</td>
              <td>{{ row.table_name }}</td>
              <td>{{ row.record_id }}</td>
              <td>{{ row.actor_id || 'System' }}</td>
            </tr>
            } @empty {
            <tr>
              <td colspan="5">
                @if (!loading() && !error()) {
                <app-async-state kind="empty" title="No matching audit events." />
                }
              </td>
            </tr>
            }
          </tbody>
        </table>
      </div>
    </app-data-table>
  </section>
</section>
