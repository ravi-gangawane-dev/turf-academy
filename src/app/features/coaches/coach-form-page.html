<div class="coach-form-page">
  <app-page-hero [title]="editing() ? 'Edit Coach' : 'Add Coach'" [subtitle]="editing() ? 'Update coach information and professional details.' : 'Register a new coach with the academy.'" [breadcrumbs]="[{ label: 'Dashboard', icon: 'pi-home', route: '/dashboard' }, { label: 'Coaches', route: '/coaches' }, { label: editing() ? 'Edit Coach' : 'Add Coach' }]" />
  @if (message()) { <div class="notice" role="alert">{{ message() }}</div> }
  <form [formGroup]="form" (ngSubmit)="save()"><main>
    <section class="card personal"><h2><i class="pi pi-user"></i>Personal information</h2><div class="fields">
      <label>Employee code *<input formControlName="employeeCode" placeholder="Enter employee code" /></label><label>First name *<input formControlName="firstName" placeholder="Enter first name" /></label><label>Last name *<input formControlName="lastName" placeholder="Enter last name" /></label><label>Status *<select formControlName="status"><option value="active">Active</option><option value="inactive">Inactive</option></select></label>
      <label>Phone number *<input formControlName="phone" maxlength="10" placeholder="Enter 10 digit mobile number" /></label><label>Email address<input type="email" formControlName="email" placeholder="Enter email address" /></label><label>Date of birth<input type="date" formControlName="dateOfBirth" /></label><label>Experience (years) *<input type="number" min="0" step="0.5" formControlName="experienceYears" /></label>
    </div></section>
    <section class="card professional"><h2><i class="pi pi-briefcase"></i>Professional information</h2><div class="fields"><label>Qualification *<input formControlName="qualification" placeholder="Enter highest qualification" /></label><label>Primary specialization *<input formControlName="primarySpecialization" placeholder="e.g. Batting" /></label><label>Additional specializations<input formControlName="additionalSpecializations" placeholder="Bowling, Fitness" /></label><label>Biography<input formControlName="biography" placeholder="Short professional biography" /></label></div></section>
    <footer><button type="button" (click)="cancel()">Cancel</button><button class="primary" [disabled]="loading()"><i class="pi pi-check"></i>{{ loading() ? 'Saving...' : editing() ? 'Update coach' : 'Save coach' }}</button></footer>
  </main><aside><section class="card photo"><h2><i class="pi pi-image"></i>Coach photo</h2><label class="upload" [class.has-photo]="photoUrl()">@if (photoUrl()) { <img [src]="photoUrl()" alt="Coach profile" /> } @else { <i class="pi pi-camera"></i> }<strong>{{ photoUrl() ? 'Change coach photo' : 'Upload coach photo' }}</strong><small>JPG, PNG up to 2MB</small><b>Choose file</b><input type="file" accept="image/png,image/jpeg" (change)="selectPhoto($event)" /></label></section><section class="card help"><h2><i class="pi pi-info-circle"></i>Coach profile</h2><p>Qualifications and specializations are shown on the coach details page.</p><p>Assigned batches are loaded directly from Supabase.</p></section></aside></form>
</div>
