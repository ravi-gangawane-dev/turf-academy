<div class="history-corrections-page">
  <app-page-hero
    title="Attendance History & Corrections"
    subtitle="View attendance records and make corrections when required."
    [breadcrumbs]="[
      { label: 'Dashboard', icon: 'pi-home', route: '/dashboard' },
      { label: 'Attendance', route: '/attendance' },
      { label: 'Attendance History & Corrections' },
    ]"
  />
  <app-attendance-view-navigation />

  <nav class="view-tabs" role="tablist" aria-label="Attendance views">
    @for (item of tabs; track item.id) {
      <button
        type="button"
        role="tab"
        [id]="'attendance-tab-' + item.id"
        [attr.aria-selected]="tab() === item.id"
        [class.active]="tab() === item.id"
        (click)="select(item.id)"
      >
        <i class="pi" [class]="'pi ' + item.icon" aria-hidden="true"></i>
        {{ item.label }}
      </button>
    }
  </nav>

  <div role="tabpanel" [attr.aria-labelledby]="'attendance-tab-' + tab()">
    @if (tab() === 'history') {
      <app-attendance-history-page />
    } @else {
      <app-attendance-correction-page />
    }
  </div>
</div>
