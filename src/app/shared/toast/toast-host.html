<div class="toasts" role="region" aria-label="Notifications" aria-live="polite" aria-atomic="false">
  @for (item of toast.messages(); track item.id) {
  <article class="toast toast-{{ item.kind }}" [attr.data-toast-id]="item.id" (mouseenter)="handleToastEvent($event, 'pause')" (mouseleave)="handleToastEvent($event, 'resume')">
    <i class="pi" [class]="'pi ' + icon(item.kind)" aria-hidden="true"></i>
    <span class="toast-text">{{ item.text }}</span>
    <button type="button" class="toast-close" aria-label="Dismiss" (click)="handleToastEvent($event, 'dismiss')">
      <i class="pi pi-times" aria-hidden="true"></i>
    </button>
  </article>
  }
</div>
