<footer class="print-page-footer">
  <span class="print-page-footer-label">{{ label() }}</span>
  @if (note()) {
    <span class="print-page-footer-note">{{ note() }}</span>
  }
  @if (brandNote()) {
    <span class="print-page-footer-brand">{{ brandNote() }}</span>
  }
  <span class="print-page-footer-page">{{ pageLabel() }}</span>
</footer>
