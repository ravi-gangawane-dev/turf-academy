@if (open()) {
  <div class="export-backdrop" role="presentation" (click)="onBackdrop($event)">
    <section
      class="export-dialog"
      appModalFocus
      [modalBusy]="busy()"
      (modalDismiss)="close()"
      aria-labelledby="export-dialog-title"
    >
      <header>
        <div>
          <p class="export-kicker">Download records</p>
          <h2 id="export-dialog-title">{{ title() }}</h2>
          @if (subtitle()) {
            <p class="export-subtitle">{{ subtitle() }}</p>
          }
        </div>
        <button type="button" class="export-close" (click)="close()" [disabled]="busy()"
          aria-label="Close export dialog" title="Close">
          <i class="pi pi-times" aria-hidden="true"></i>
        </button>
      </header>

      <fieldset class="export-group" [disabled]="busy()">
        <legend>Which rows?</legend>
        <div class="export-options">
          @for (option of options(); track option.value) {
            <label class="export-option" [class.export-option--active]="scope() === option.value">
              <input
                type="radio"
                name="export-scope"
                [value]="option.value"
                [checked]="scope() === option.value"
                (change)="selectScope(option.value)"
              />
              <span>
                <strong>{{ option.label }}</strong>
                <small>{{ option.description }}</small>
              </span>
              <b>{{ option.count }}</b>
            </label>
          }
        </div>
      </fieldset>

      <fieldset class="export-group" [disabled]="busy()">
        <legend>File type</legend>
        <div class="export-formats">
          @for (option of formats(); track option.value) {
            <button
              type="button"
              [class.export-format--active]="option.value === format()"
              [attr.aria-pressed]="option.value === format()"
              [disabled]="busy()"
              (click)="selectFormat(option.value)"
            >
              <strong>{{ option.label }}</strong>
              <small>{{ option.hint }}</small>
            </button>
          }
        </div>
      </fieldset>

      @if (error()) {
        <p class="export-error" role="alert">{{ error() }}</p>
      }

      <footer>
        <button type="button" [disabled]="busy()" (click)="close()">Cancel</button>
        <button type="button" class="primary" [disabled]="!canExport()" (click)="request()">
          @if (busy()) {
            <span class="spinner" aria-hidden="true"></span>
            Preparing…
          } @else {
            <i class="pi pi-download" aria-hidden="true"></i>
            {{ formatLabel() }}
          }
        </button>
      </footer>
    </section>
  </div>
}
